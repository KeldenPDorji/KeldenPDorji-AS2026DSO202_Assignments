# ClusterIP. The backend is reachable from the frontend tier inside the
# cluster and from nowhere else. No environment overlay changes this.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    tier: backend
spec:
  type: ClusterIP
  selector:
    tier: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
