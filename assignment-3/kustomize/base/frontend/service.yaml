# NodePort 30080 in the base, so the base is deployable on its own and the
# page is reachable at http://localhost:30080 on the kind cluster from
# Practical 1, whose extraPortMappings entry maps that port.
#
# The prod overlay turns this into a ClusterIP with a JSON 6902 patch, because
# a production frontend belongs behind a controlled entry point rather than on
# a node port. Removing the nodePort field is required there, not cosmetic: the
# API server rejects a ClusterIP Service that still carries one.
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    tier: frontend
spec:
  type: NodePort
  selector:
    tier: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
