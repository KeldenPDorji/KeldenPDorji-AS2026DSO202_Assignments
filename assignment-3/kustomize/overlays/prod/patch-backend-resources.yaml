# Strategic merge patch: production resource envelope for the backend.
#
# This style was chosen because the change is naturally a Kubernetes-shaped
# fragment and touches a named list item (the "backend" container). Kustomize
# matches the object by kind and name, matches the container by its name, and
# merges only the fields written here. Everything else in the base Deployment
# is left alone, so this file never needs updating when the base changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
