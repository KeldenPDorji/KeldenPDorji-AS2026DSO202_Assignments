{{- /*
secret.yaml - credentials, under both naming conventions.

b64enc produces the base64 encoding the data field requires. That is an
encoding, not encryption: the value is recoverable by anyone who can read the
Secret, and Helm additionally stores it in the release record, where
"helm get values" will print it back.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.fullname" . }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
type: Opaque
data:
  # consumed by the backend tier
  DB_USER: {{ .Values.credentials.user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.credentials.password | b64enc | quote }}
  # consumed by the database tier
  POSTGRES_USER: {{ .Values.credentials.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | b64enc | quote }}
