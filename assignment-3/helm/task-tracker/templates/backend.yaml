{{- /*
backend.yaml - the API tier and its ClusterIP Service.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-backend" (include "task-tracker.fullname" .) }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "task-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-backend" (include "task-tracker.fullname" .) }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: backend
          image: {{ include "task-tracker.image" (dict "root" $ "tier" .Values.backend) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          # DB_* only. Each key is referenced individually, so this template
          # states exactly which configuration the tier consumes.
          env:
            {{- range $key := list "DB_HOST" "DB_PORT" "DB_NAME" "APP_PORT" "CORS_ORIGIN" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "DB_USER" "DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
