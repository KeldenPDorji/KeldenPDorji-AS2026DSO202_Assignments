{{- /*
database.yaml - the PVC, Deployment and headless Service of the database tier,
kept in one file because they are a single unit that is never deployed apart.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-db" (include "task-tracker.fullname" .) }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage }}
---
apiVersion: v1
kind: Service
metadata:
  # The ConfigMap sets DB_HOST to this same name, derived the same way, so the
  # backend's connection target and the Service's name cannot disagree.
  name: {{ printf "%s-db" (include "task-tracker.fullname" .) }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    {{- include "task-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-db" (include "task-tracker.fullname" .) }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: database
      annotations:
        {{- /*
        A hash of the rendered ConfigMap and Secret. A Deployment rolls out new
        Pods only when its Pod template changes, and a ConfigMap change alone
        does not change the Pod template. Hashing the rendered text into an
        annotation makes every configuration change produce a new template and
        so a controlled rolling update. This is Helm's equivalent of the name
        hash Kustomize puts on a generated ConfigMap.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: postgres
          image: {{ include "task-tracker.image" (dict "root" $ "tier" .Values.database) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.fullname" . }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.fullname" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.fullname" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ printf "%s-db" (include "task-tracker.fullname" .) }}
