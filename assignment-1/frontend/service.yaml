# Task 5 - NodePort Service for the frontend.
#
# nodePort 30080 is not arbitrary: the kind cluster from Practical 1 was created
# with an extraPortMappings entry mapping containerPort 30080 to hostPort 30080,
# so http://localhost:30080 on the host reaches this Service. Any other nodePort
# would only be reachable through kubectl port-forward.
#
# This is the ONLY externally reachable Service in the namespace, and the
# ResourceQuota's services.nodeports: "1" keeps it that way.
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: frontend
spec:
  type: NodePort
  selector:
    app: task-tracker
    tier: frontend
  ports:
    - name: http
      port: 8080         # Service port, inside the cluster
      targetPort: 8080   # container port in the frontend Pod
      nodePort: 30080    # host port, via the kind extraPortMappings entry
      protocol: TCP
