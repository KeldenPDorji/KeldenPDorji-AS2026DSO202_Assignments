# Task 5 - frontend tier.
#
# The only configuration this tier needs is BACKEND_URL. The image's entrypoint
# runs envsubst at container start to render that value into config.js before
# nginx serves anything, so the backend address is never baked in at build time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
      tier: frontend
  template:
    metadata:
      labels:
        app: task-tracker
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: sarojsanyasi/dso202-frontend:1.0    # pinned tag, never :latest
          ports:
            - name: http
              containerPort: 8080    # image runs as non-root, so it binds 8080, not 80
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BACKEND_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
