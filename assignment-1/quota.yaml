# Task 6 - namespace resource governance.
#
# Two complementary objects:
#   ResourceQuota  - a CEILING on what the whole namespace may consume.
#   LimitRange     - a per-container DEFAULT and per-container MIN/MAX.
#
# The LimitRange matters even though every Deployment here sets its own
# resources explicitly: it guarantees that any Pod created later (an imperative
# `kubectl run`, a debug Pod) still lands inside the quota's accounting instead
# of being rejected for having no requests at all.
#
# Numbers are derived from the three workloads, not copied:
#   frontend  nginx serving static files   50m / 64Mi   requested
#   backend   Node.js + pg client         100m / 128Mi  requested
#   database  PostgreSQL 17               250m / 256Mi  requested
#   sum = 400m CPU / 448Mi memory requested at steady state.
# Worst case during a rolling update the frontend and backend each briefly run
# a surge replica (the database uses strategy Recreate, so it never doubles),
# giving 550m CPU / 640Mi requested and 2400m CPU / 1280Mi limited. Each quota
# figure below sits just above that worst case, so a rollout can never deadlock
# while the ceiling still stops a runaway from starving the kind node.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dso202-quota
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
spec:
  hard:
    # Compute - headroom of ~2x steady state, ~1.2x worst-case rollout.
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi

    # Object counts - three tiers at one replica each, plus rollout surge.
    pods: "10"
    services: "5"

    # Storage - one 1Gi database PVC; the second slot allows a restore/migration
    # PVC to be created alongside it without editing the quota.
    persistentvolumeclaims: "2"
    requests.storage: 2Gi

    # Governance control that enforces a non-negotiable constraint of this
    # assignment: exactly ONE NodePort may exist in this namespace, so the
    # backend and database physically cannot be exposed outside the cluster
    # even by accident.
    services.nodeports: "1"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dso202-limits
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
spec:
  limits:
    - type: Container
      # Applied when a container omits resources entirely.
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 256Mi
      # Floor: below this a container cannot be usefully scheduled and would
      # only fragment the node's allocatable capacity.
      min:
        cpu: 50m
        memory: 64Mi
      # Ceiling: no single container in this teaching namespace may claim more
      # than one core or half a gigabyte - that is the database's own limit,
      # and nothing here is heavier than the database.
      max:
        cpu: "1"
        memory: 512Mi
    - type: PersistentVolumeClaim
      min:
        storage: 500Mi
      max:
        storage: 2Gi
