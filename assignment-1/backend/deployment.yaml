# Task 4 - backend tier.
#
# Consumes DB_* only. DB_HOST is the database Service NAME, not an IP: the Pod
# may be rescheduled and change address, but `db-svc` keeps resolving.
#
# No readiness probe is used (Unit I scope). The image compensates with startup
# retry/backoff, so the backend may legitimately log "not reachable yet" for a
# few seconds while the database finishes initialising, then connect on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        app: task-tracker
        tier: backend
    spec:
      containers:
        - name: backend
          image: sarojsanyasi/dso202-backend:1.0    # pinned tag, never :latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # --- non-sensitive: ConfigMap ---
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CORS_ORIGIN
            # --- credentials: Secret ---
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
