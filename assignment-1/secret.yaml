# Task 2 - every CREDENTIAL value, for both naming conventions.
#
# As with the ConfigMap, the key names differ per tier but the values are
# paired: DB_USER == POSTGRES_USER and DB_PASSWORD == POSTGRES_PASSWORD.
# The backend authenticates with the DB_* pair against the role that the
# postgres image creates from the POSTGRES_* pair.
#
# SECURITY CAVEAT (documentation requirement, Task 2): the values below are
# base64-ENCODED, not encrypted. Anyone who can read this file or run
# `kubectl get secret -o yaml` can decode them with `base64 -d`. Kubernetes
# Secrets are also stored unencrypted in etcd unless an EncryptionConfiguration
# provider is enabled on the API server. See README §"Secret encoding caveat".
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
type: Opaque
data:
  # --- consumed by the backend tier ---
  DB_USER: dGFza3VzZXI=                    # taskuser
  DB_PASSWORD: VDRza1RyNGNrM3ItMjAyNg==    # (decodes to the same value as POSTGRES_PASSWORD)

  # --- consumed by the database tier ---
  POSTGRES_USER: dGFza3VzZXI=
  POSTGRES_PASSWORD: VDRza1RyNGNrM3ItMjAyNg==
