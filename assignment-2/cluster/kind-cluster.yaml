# Unit II cluster: the Practical 1 topology, extended for an Ingress controller.
#
# Two changes from the Assignment 1 config, both required by §2.2:
#
#   1. node-labels: ingress-ready=true on the control-plane. The kind-provider
#      manifest for ingress-nginx uses a nodeSelector for this label plus a
#      toleration for the control-plane taint, so the controller Pod lands here.
#   2. extraPortMappings for 80 and 443 instead of 30080. Unit I reached the
#      frontend through one NodePort per Service; Unit II replaces that with a
#      single Ingress entry point on the standard HTTP/HTTPS ports, so no
#      NodePort mapping is needed at all.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: dso202

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  apiServerAddress: "127.0.0.1"

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.36.1
    labels:
      dso202/node-role: worker
      dso202/node-index: "1"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1

  - role: worker
    image: kindest/node:v1.36.1
    labels:
      dso202/node-role: worker
      dso202/node-index: "2"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2
