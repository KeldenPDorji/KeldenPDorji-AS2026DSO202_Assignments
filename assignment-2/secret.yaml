# Credentials for both naming conventions, unchanged from Assignment 1:
# DB_USER == POSTGRES_USER and DB_PASSWORD == POSTGRES_PASSWORD.
#
# SECURITY CAVEAT: these values are base64-ENCODED, not encrypted, and are
# stored unencrypted in etcd unless an EncryptionConfiguration provider is
# enabled on the API server. See the README.
#
# §2.3 makes this concrete rather than theoretical: the read-only Role in
# rbac/viewer.yaml deliberately excludes `secrets` from its resources, because
# read access to a Secret IS the credential.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
type: Opaque
data:
  # --- backend tier ---
  DB_USER: dGFza3VzZXI=                    # taskuser
  DB_PASSWORD: VDRza1RyNGNrM3ItMjAyNg==

  # --- database tier ---
  POSTGRES_USER: dGFza3VzZXI=
  POSTGRES_PASSWORD: VDRza1RyNGNrM3ItMjAyNg==
